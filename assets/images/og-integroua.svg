<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0A0F1D"/>
  <circle cx="100" cy="100" r="300" fill="#3B82F6" opacity="0.12" filter="blur(80px)"/>
  <circle cx="1100" cy="500" r="350" fill="#F59E0B" opacity="0.08" filter="blur(90px)"/>
  
  <!-- Logo symbol -->
  <g transform="translate(100, 120)">
    <rect width="32" height="32" rx="8" fill="#FFFFFF"/>
    <rect x="40" width="32" height="32" rx="8" fill="#FFFFFF"/>
    <rect y="40" width="32" height="32" rx="8" fill="#FFFFFF"/>
    <rect x="40" y="40" width="32" height="32" rx="8" fill="#F59E0B"/>
    <text x="96" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-1px">integro<tspan fill="#F59E0B">UA</tspan></text>
  </g>

  <!-- Tagline -->
  <text x="100" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5px">Маркетинг, у якого є план</text>
  
  <!-- Subtitle -->
  <text x="100" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="400" fill="#94A3B8">Аналіз ринку, стратегія, потижневий план, бюджет і контент на 12 тижнів</text>
  
  <!-- Pill Badges -->
  <g transform="translate(100, 420)">
    <rect width="180" height="46" rx="23" fill="#1E293B" stroke="#334155"/>
    <text x="90" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="600" fill="#E2E8F0" text-anchor="middle">Аналіз ринку</text>
  </g>
  <g transform="translate(300, 420)">
    <rect width="160" height="46" rx="23" fill="#1E293B" stroke="#334155"/>
    <text x="80" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="600" fill="#E2E8F0" text-anchor="middle">Стратегія</text>
  </g>
  <g transform="translate(480, 420)">
    <rect width="180" height="46" rx="23" fill="#1E293B" stroke="#334155"/>
    <text x="90" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="18" font-weight="600" fill="#E2E8F0" text-anchor="middle">12 тижнів плану</text>
  </g>
  
  <!-- URL watermark -->
  <text x="100" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="22" font-weight="600" fill="#64748B">integro.ua</text>
</svg>
